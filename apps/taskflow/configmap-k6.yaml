
# Le scénario de test de charge, exécuté par k6 pendant le canary.
# Les seuils (thresholds) traduisent notre exigence de robustesse :
#   - moins de 2 % de requêtes en erreur
#   - 95 % des réponses en moins de 250 ms
# Si un seuil échoue, k6 interrompt le test et retourne un code d'erreur.

apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-robustesse
data:
  robustesse.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 5,
      duration: '30s',
      NoConnectionReuse: true,
      thresholds: {
        http_req_failed: [
          {
            threshold: 'rate<0.02',
            abortOnFail: true,
            delayAbortEval: '5s',
          },
        ],
        http_req_duration: [
          {
            threshold: 'p(95)<250',
            abortOnFail: true,
            delayAbortEval: '5s',
          },
        ],
      },
    };

    const TARGET = __ENV.TARGET || 'http://taskflow-canary';

    export default function () {
      const res = http.get(`${TARGET}/tasks`);

      check(res, {
        'statut 200': (r) => r.status === 200,
      });

      sleep(0.2);
    }
